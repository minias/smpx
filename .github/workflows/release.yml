name: Release
permissions:
  contents: read

on:
  # v* 태그 push → 빌드 후 GitHub Release 생성
  push:
    tags:
      - "v*"
  # 패키징 관련 변경 PR → 빌드만 (Release 없음, 결과물은 Actions artifact)
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "scripts/**"
      - "build/**"
      - "wails.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

env:
  WAILS_VERSION: v2.17.1

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # 태그면 v 를 뗀 버전, 아니면 0.0.<run_number> (CFBundleVersion / dpkg 모두 숫자여야 함)
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS (universal dmg)
    needs: version
    runs-on: macos-14
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      # Developer ID 인증서가 Secrets 에 있을 때만 서명 / 공증
      - name: Import signing certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # Developer ID Application(유료, 서명 + 공증) 우선, 없으면 Apple Development(무료, 서명만)
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          IDENTITY="$(echo "$IDENTITIES" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(echo "$IDENTITIES" | grep 'Apple Development' | head -1 | awk -F'"' '{print $2}')"
            [ -n "$IDENTITY" ] && echo "::notice::Apple Development 인증서로 서명합니다 (공증 없음 — 다른 Mac 에서는 최초 1회 '그래도 열기' 필요)"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::warning::사용할 수 있는 서명 인증서가 없어 서명 없이 빌드합니다 (docs/RELEASE.md 참고)"
            exit 0
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Package
        run: scripts/package-macos.sh "${{ needs.version.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux (deb, tar.gz)
    needs: version
    # 22.04: 오래된 glibc 로 빌드해 최신 배포판까지 호환, WebKitGTK 4.1 제공
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Package
        run: scripts/package-linux.sh "${{ needs.version.outputs.version }}"

      # 패키지 메타데이터 / 설치 가능 여부 확인
      - name: Verify deb
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/smpx

      # 설치한 앱을 가상 화면에서 실행: 정상 기동 + yt-dlp 최초 자동 설치(다운로드 + SHA-256 검증) 확인
      - name: Smoke test (xvfb)
        run: |
          sudo apt-get install -y xvfb
          # 깨끗한 설정 폴더에서 실행 (러너는 XDG_CONFIG_HOME 을 지정하므로 함께 변경)
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1

          dbus-run-session -- xvfb-run -a smpx > "$RUNNER_TEMP/smpx.log" 2>&1 &

          YTDLP="$XDG_CONFIG_HOME/smpx/bin/yt-dlp"
          for i in $(seq 1 150); do
            [ -x "$YTDLP" ] && break
            sleep 2
          done

          cat "$RUNNER_TEMP/smpx.log"
          ls -la "$XDG_CONFIG_HOME/smpx/bin" || true
          pgrep -x smpx
          "$YTDLP" --version
          pkill -x smpx || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SMPX $GITHUB_REF_NAME" \
            --generate-notes
