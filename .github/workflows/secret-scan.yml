name: Secret Scan
permissions:
  contents: read

# 공개 저장소: 토큰 / 키 / 비밀번호 등이 커밋되지 않았는지 PR · push 마다 검사
on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
