name: Go Wails CI
permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails(Linux) 빌드에 필요한 GTK / WebKit 개발 패키지
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ubuntu-latest(24.04) 는 webkit2gtk-4.1 만 제공
      - name: Build
        run: go build -tags webkit2_41 -v ./...

      - name: Run tests
        run: go test -tags webkit2_41 -v ./...

      - name: Run vet
        run: go vet -tags webkit2_41 ./...
