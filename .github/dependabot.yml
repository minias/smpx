version: 2
updates:
  # 업데이트 PR 은 dev 로 (작업 브랜치 → dev → main 흐름 유지)
  - package-ecosystem: "gomod"
    directory: "/"        # Go 모듈 루트
    target-branch: "dev"
    # 간접 의존성 버전은 wails 등 직접 의존성이 결정하므로 직접 의존성만 업데이트
    allow:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/frontend" # Svelte 프론트엔드
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
