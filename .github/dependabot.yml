version: 2
updates:
  # 업데이트 PR 은 dev 로 (작업 브랜치 → dev → main 흐름 유지)
  - package-ecosystem: "gomod"
    directory: "/"        # Go 모듈 루트
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/frontend" # Svelte 프론트엔드
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # svelte / vite 메이저 업그레이드는 코드 마이그레이션이 필요하므로 수동으로 진행
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
